<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raccoon Tools</title>
  <link rel="stylesheet" href="style.css" />
  


</head>
<body>
  <div class="header">
    <h1>🦝 Raccoon Tools</h1>
    <span>⚙️</span>
  </div>

  <!-- Privat BOXEN -->
<!-- Privat BOXEN -->
<div class="section card">
  <div class="section-header">
    <label>PrivatTTTT</label>
    <label class="switch">
      <input type="checkbox" checked id="toggleInventory">
      <span class="slider"></span>
    </label>
  </div>
  <div class="quick-buttons" id="inventoryBox">
<button id="btnInventory">Inventory</button>
<button id="btnTrade">Trade</button>
<button id="btnApiKey">API Key</button>

  </div>
</div>
 <!-- Här ska knivlistan ifrån Functions/knifefinder.js köras -->

  <!-- Knife Finder BOXEN -->
<div class="section card">
  <div class="section-header">
    <label>Knife Finder</label>
    <label class="switch">
      <input type="checkbox" checked id="toggleFilter">
      <span class="slider"></span>
    </label>
  </div>
  <div id="filterBox">   <!-- Knife Finder Filterbox -->
    <select id="knifeType">  
 
    </select>
    <select id="knifeSkin">          <!-- Knifeskin Finder BOXEN -->
     <!-- <option>Doppler</option> --> 
    </select>

    <div class="checkbox-group compact">
      <div class="checkbox-inline">
        <label>
          <input type="checkbox" name="ToggleKnifeGlow" id="ToggleKnifeGlow"> 🔥 Glow
        </label>
        <input type="number" placeholder="-99" min="-99" max="12" name="KnifeGlowPlaceholder1" id="KnifeGlowPlaceholder1">
        <input type="number" placeholder="12" min="-99" max="12" name="KnifeGlowPlaceholder2" id="KnifeGlowPlaceholder2">
      </div>

      <div class="checkbox-inline">
        <label>
          <input type="checkbox" name="ToggleKnifeAlert" id="ToggleKnifeAlert"> 🔊 Alert
        </label>
        <input type="number" placeholder="-99" min="-99" max="12" name="KnifeAlertPlaceholder1" id="KnifeAlertPlaceholder1">
        <input type="number" placeholder="12" min="-99" max="12" name="KnifeAlertPlaceholder2" id="KnifeAlertPlaceholder2">
      </div>

      <div class="checkbox-inline">
        <label>
          <input type="checkbox" name="ToggleKnifeBlink" id="ToggleKnifeBlink"> 🚨 Blink
        </label>
        <input type="number" placeholder="-99" min="-99" max="12" name="KnifeBlinkPlaceholder1" id="KnifeBlinkPlaceholder1">
        <input type="number" placeholder="12" min="-99" max="12" name="KnifeBlinkPlaceholder2" id="KnifeBlinkPlaceholder2">
      </div>
    </div>

   <!--  <button class="full-width">🔍 Sök</button> -->
  </div>
</div>


  <!-- Kalkylator (Coin + Bargain) -->
  <div class="section card">
    <div class="section-header"><label>Kalkylator</label><label class="switch"><input type="checkbox" checked id="toggleCalc"><span class="slider"></span></label></div>
    <div id="calcBox">
      <!-- Coin converter -->
      <label>Coin Converter</label>
      <input type="number" id="coinInput" placeholder="Coins" />
      <div class="output-line"><span>€ <span id="euroOutput">0.00</span></span><span>SEK <span id="sekOutput">0.00</span></span></div>
      <hr style="border:none;height:1px;background:#000;margin:10px 0;">
      <!-- Bargain calculator -->
      <label>Bargain Calculator</label>
      <input type="number" id="bargainPrice" placeholder="Listpris (coins)">
      <input type="number" id="bargainOrig" placeholder="Original % (0-12)" min="0" max="12" step="0.1">
    <input type="range" class="custom-slider" id="bargainNew" min="0" max="12" step="0.1" value="0">

      <div class="output-line">Nytt pris @ <span id="bargainNewVal">0.0</span>%: <span id="bargainNewPrice">0.00</span></div>
      <div class="output-line">Diff mot <span id="bargainOrigVal">0.0</span>%: <span id="bargainDiff">0.00</span></div>
    </div>
  </div>

  
  <!-- Options -->
 <!-- Glow Options BOXEN -->
<div class="section card">
  <div class="section-header">
    <label>Options</label>
    <label class="switch">
      <input type="checkbox" checked id="toggleGlowOpts">
      <span class="slider"></span>
    </label>
  </div>

  <div id="glowOptionsBox" class="checkbox-group compact">

<!-- Glow -->
<div class="checkbox-inline">
  <label class="toggle-switch">
    <input type="checkbox" id="GlowToggle">
    <span class="toggle-slider"></span>
  </label>
  <label for="GlowToggle">🔥 Glow</label>
  <input type="number" id="GlowValue1" name="GlowValue1" placeholder="-99" min="-99" max="12">
  <input type="number" id="GlowValue2" name="GlowValue2" placeholder="12" min="-99" max="12">
</div>

<!-- Alert -->
<div class="checkbox-inline">
  <label class="toggle-switch">
    <input type="checkbox" id="AlertToggle">
    <span class="toggle-slider"></span>
  </label>
  <label for="AlertToggle">🔊 Alert</label>
  <input type="number" id="alertValue1" name="alertValue1" placeholder="-99" min="-99" max="12">
  <input type="number" id="alertValue2" name="alertValue2" placeholder="12" min="-99" max="12">
</div>

<!-- Blink -->
<div class="checkbox-inline">
  <label class="toggle-switch">
    <input type="checkbox" id="BlinkToggle">
    <span class="toggle-slider"></span>
  </label>
  <label for="BlinkToggle">🚨 Blink</label>
  <input type="number" id="BlinkValue1" name="BlinkValue1" placeholder="-99" min="-99" max="12">
  <input type="number" id="BlinkValue2" name="BlinkValue2" placeholder="12" min="-99" max="12">
</div>

    <hr style="border:none;height:1px;background:#000;margin:10px 0;">

    <!-- Övriga alternativ -->

<!-- Övriga alternativ -->

<div class="toggle-wrapper">
  <label for="toggle-procent-viewer">➗ Procent Viewer</label>
  <label class="switch">
    <input type="checkbox" id="toggle-procent-viewer">
    <span class="slider"></span>
  </label>
</div>
<div class="toggle-wrapper">
  <label for="toggle-scout-mode">🔭 Scout mode</label>
  <label class="switch">
    <input type="checkbox" id="toggle-scout-mode">
    <span class="slider"></span>
  </label>
</div>
<div class="toggle-wrapper">
  <label for="toggle-profit-potential">📈 Profit Potential</label>
  <label class="switch">
    <input type="checkbox" id="toggle-profit-potential">
    <span class="slider"></span>
  </label>
</div>
<div class="toggle-wrapper">
  <label for="toggle-wallet-converter">💰 Wallet converter</label>
  <label class="switch">
    <input type="checkbox" id="toggle-wallet-converter">
    <span class="slider"></span>
  </label>
</div>
<div class="toggle-wrapper">
  <label for="toggle-insta">⚡ Insta</label>
  <label class="switch">
    <input type="checkbox" id="toggle-insta">
    <span class="slider"></span>
  </label>
</div>
<div class="toggle-wrapper">
  <label for="toggle-print-info">📷 Print Info</label>
  <label class="switch">
    <input type="checkbox" id="toggle-print-info">
    <span class="slider"></span>
  </label>
</div>




    
    
    
    
    
    
</div>
</div> <!-- ✅  -->


  


  
  
  
  
  
  
  
  
<!-- Misc Box -->
<div class="section card misc-box">
  <div class="section-header">
    <label>Tutorial / Info</label>
    <label class="switch">
    <input type="checkbox" id="toggleMisc">
      <span class="slider"></span>
    </label>
  </div>

  <div class="quick-buttons hidden" id="miscContent">
    <label>➗ = Magnifying glass on %</label>
    <label>🔭 = CTRL + SHIFT gives info on cards</label>
    <label>📈 = Calculates your profit if you buy</label>
    <label>💰 = Converts Roll coins to EUR/SEK live</label>
    <label>⚡ = CTRL+SHIFT+m1 to insta-buy </label>
    <label>📸 = CTRL+SHIFT+K Print info to exel</label>

    <label>🟩 = Procent glower</label>
    <label>🟨 = Procent glower</label>
    <label>🟥 = Procent glower</label>

    <hr style="border:none;height:1px;background:#000;margin:10px 0;">

    <label><br><strong>API key</strong> (F12 console command)</label>
    <br><br><br>

  is a school project dont use

  </div>

  <div class="footer">Raccoon Tools v2.4</div>
</div>
