<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raccoon Tools</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <h1>🦝 Raccoon Tools</h1>
    <span>⚙️</span>
  </div>

  <!-- Privat BOXEN -->
  <div class="section card">
    <div class="section-header"><label>Privat</label><label class="switch"><input type="checkbox" checked id="toggleInventory"><span class="slider"></span></label></div>
    <div class="quick-buttons" id="inventoryBox"><button>Inventory</button><button>Trade</button><button>API Key</button></div>
  </div>

  <!-- Knife Finder BOXEN -->
  <div class="section card">
    <div class="section-header"><label>Knife Finder</label><label class="switch"><input type="checkbox" checked id="toggleFilter"><span class="slider"></span></label></div>
    <div id="filterBox">
      <select id="knifeType"><option>Bayonet</option><option>Karambit</option><option>Butterfly Knife</option><option>M9 Bayonet</option><option>Flip Knife</option></select>
      <select id="knifeSkin"><option>Doppler</option><option>Fade</option><option>Lore</option><option>Crimson Web</option><option>Tiger Tooth</option></select>
      <div class="checkbox-group compact">
        <div class="checkbox-inline"><label><input type="checkbox"> 🔥 Glow</label><input type="number" placeholder="-99" min="-99" max="12"><input type="number" placeholder="12" min="-99" max="12"></div>
        <div class="checkbox-inline"><label><input type="checkbox"> 🔊 Alert</label><input type="number" placeholder="-99" min="-99" max="12"><input type="number" placeholder="12" min="-99" max="12"></div>
        <div class="checkbox-inline"><label><input type="checkbox"> 🚨 Blink</label><input type="number" placeholder="-99" min="-99" max="12"><input type="number" placeholder="12" min="-99" max="12"></div>
      </div>
      <button class="full-width">🔍 Sök</button>
    </div>
  </div>

  <!-- Kalkylator (Coin + Bargain) -->
  <div class="section card">
    <div class="section-header"><label>Kalkylator</label><label class="switch"><input type="checkbox" checked id="toggleCalc"><span class="slider"></span></label></div>
    <div id="calcBox">
      <!-- Coin converter -->
      <label>Coin Converter</label>
      <input type="number" id="coinInput" placeholder="Coins" />
      <div class="output-line"><span>€ <span id="euroOutput">0.00</span></span><span>SEK <span id="sekOutput">0.00</span></span></div>
      <hr style="border:none;height:1px;background:#000;margin:10px 0;">
      <!-- Bargain calculator -->
      <label>Bargain Calculator</label>
      <input type="number" id="bargainPrice" placeholder="Listpris (coins)">
      <input type="number" id="bargainOrig" placeholder="Original % (0-12)" min="0" max="12" step="0.1">
      <input type="range" id="bargainNew" min="0" max="12" step="0.1" value="0">
      <div class="output-line">Nytt pris @ <span id="bargainNewVal">0.0</span>%: <span id="bargainNewPrice">0.00</span></div>
      <div class="output-line">Diff mot <span id="bargainOrigVal">0.0</span>%: <span id="bargainDiff">0.00</span></div>
    </div>
  </div>

  <!-- Glow Options BOXEN -->
  <div class="section card">
    <div class="section-header"><label>Options</label><label class="switch"><input type="checkbox" checked id="toggleGlowOpts"><span class="slider"></span></label></div>
    <div id="glowOptionsBox" class="checkbox-group compact">


      <div class="checkbox-inline"><label><input type="checkbox"> 🔥 Glow</label><input type="number" placeholder="-99" min="-99" max="12"><input type="number" placeholder="12" min="-99" max="12"></div>
      <div class="checkbox-inline"><label><input type="checkbox"> 🔊 Alert</label><input type="number" placeholder="-99" min="-99" max="12"><input type="number" placeholder="12" min="-99" max="12"></div>
      <div class="checkbox-inline"><label><input type="checkbox"> 🚨 Blink</label><input type="number" placeholder="-99" min="-99" max="12"><input type="number" placeholder="12" min="-99" max="12"></div>
      <hr style="border:none;height:1px;background:#000;margin:10px 0;">
      
      
      <div class="checkbox-inline"><label><input type="checkbox"> ➗ Procent Viewer</label></div>
      <div class="checkbox-inline"><label><input type="checkbox"> 🔭 Scout mode</label></div>
      <div class="checkbox-inline"><label><input type="checkbox"> 📈 Profit Potential</label></div>
      <div class="checkbox-inline"><label><input type="checkbox"> 💰 Wallet converter</label></div>
      <div class="checkbox-inline"><label><input type="checkbox"> ⚡ Insta buy</label></div>
    </div>
    </div>
  </div>

  <!-- Options -->
<!-- Options -->
<!-- Options -->
<!-- Options -->
<!-- Options -->

<!-- Misc Box -->
<!-- Misc Box -->
<div class="section card misc-box">
  <div class="section-header">
    <label>Tutorial / Info</label>
    <label class="switch">
      <input type="checkbox" id="toggleMisc" onclick="document.getElementById('miscContent').classList.toggle('hidden')">
      <span class="slider"></span>
    </label>
  </div>
  <div class="quick-buttons hidden" id="miscContent">
    <label>➗ = Magnifying glass on %</label>
    <label>🔭 = CTRL + SHIFT gives info on cards</label>
    <label>📈 = Calculates your profit if you buy</label>
    <label>💰 = Converts Roll coins to EUR/SEK live</label>
    <label>⚡ = CTRL+SHIFT+m1 to insta-buy </label>
     <hr style="border:none;height:1px;background:#000;margin:10px 0;">
    <label><br><strong>API key</strong> (F12 console command)</label>
    <br>
    <br>
    <br>
    <label>Thx for using Raccoon Tools</label>
    <label>Check for update: <a href="https://github.com/MD90-Skola/Raccoon-Addon-2" target="_blank">HERE</a></label>
  </div>
  <div class="footer">Raccoon Tools v2.4</div>
</div>

<script>
(() => {
  'use strict';

  /* ----------  TOGGLE HELPERS  ---------- */
  const toggles = [
    ['toggleFilter',   'filterBox',      'block'],
    ['toggleCalc',     'calcBox',        'block'],
    ['toggleInventory','inventoryBox',   'grid'],
    ['toggleGlowOpts', 'glowOptionsBox', 'block'],
    ['toggleMisc',     'miscContent',    'block']   // Tutorial / Info
  ];

  toggles.forEach(([chkId, boxId, mode]) => {
    const chk  = document.getElementById(chkId);
    const box  = document.getElementById(boxId);
    if (!chk || !box) return;               // hoppa över saknade element

    const update = () => { box.style.display = chk.checked ? mode : 'none'; };
    chk.addEventListener('change', update);
    update();                               // init-läge
  });



  /* ----------  BARGAIN CALCULATOR  ---------- */
  const bargainFields = ['bargainPrice', 'bargainOrig', 'bargainNew']
    .map(id => document.getElementById(id))
    .filter(Boolean);

  const calcBargain = () => {
    const list =  parseFloat(bargainPrice.value) || 0;
    const orig =  parseFloat(bargainOrig.value)  || 0;
    const neu  =  parseFloat(bargainNew.value)   || 0;

    const base     = list / (1 + orig / 100);
    const newPrice = base * (1 + neu / 100);
    const diff     = newPrice - list;

    bargainNewVal.textContent   = neu .toFixed(1);
    bargainOrigVal.textContent  = orig.toFixed(1);
    bargainNewPrice.textContent = newPrice.toFixed(2);
    bargainDiff.textContent     = diff.toFixed(2);
  };

  bargainFields.forEach(el => {
    el.addEventListener('input', () => {
      if (el.id === 'bargainOrig') {
        bargainNew.value = parseFloat(bargainOrig.value) || 0;
      }
      calcBargain();
    });
  });



  /* ----------  COIN CONVERTER  ---------- */
  const COIN_TO_EUR = 0.62;
  const EUR_TO_SEK  = 10.9087;

  const coinInputEl = document.getElementById('coinInput');
  coinInputEl.addEventListener('input', () => {
    const coins = parseFloat(coinInputEl.value) || 0;
    const eur   = coins * COIN_TO_EUR;

    euroOutput.textContent = eur.toFixed(2);
    sekOutput.textContent  = (eur * EUR_TO_SEK).toFixed(2);
  });

})();
</script>

</body>
</html>
